[package]
name = "apikit"
version = "0.2.20"
description = "Modern API testing tool - A cross-platform desktop application for testing HTTP APIs"
authors = ["duwei0227"]
edition = "2024"
license = "MIT"
repository = "https://github.com/duwei0227/apikit"
homepage = "https://github.com/duwei0227/apikit"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "apikit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "multipart", "stream", "gzip", "deflate", "brotli"] }
tokio = { version = "1", features = ["fs", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
scopeguard = "1"
base64 = "0.22"
mime = "0.3"
tauri-plugin-updater = "2.10.0"
