<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="flame2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" fill="url(#sheen)"/>

  <!-- Big Dipper constellation lines — very faint -->
  <g stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-linecap="round" fill="none">
    <!-- Bowl -->
    <line x1="68"  y1="90"  x2="175" y2="102"/>
    <line x1="175" y1="102" x2="180" y2="212"/>
    <line x1="180" y1="212" x2="72"  y2="200"/>
    <line x1="72"  y1="200" x2="68"  y2="90"/>
    <!-- Handle -->
    <line x1="175" y1="102" x2="282" y2="172"/>
    <line x1="282" y1="172" x2="398" y2="272"/>
    <line x1="398" y1="272" x2="450" y2="400"/>
  </g>

  <!-- Big Dipper stars — positions form the ladle shape across full icon -->
  <circle cx="68"  cy="90"  r="3.5" fill="rgba(255,255,255,0.58)"/> <!-- Dubhe   α  上左 -->
  <circle cx="72"  cy="200" r="3.0" fill="rgba(255,255,255,0.50)"/> <!-- Merak   β  左边 -->
  <circle cx="180" cy="212" r="3.0" fill="rgba(255,255,255,0.46)"/> <!-- Phecda  γ  左中 -->
  <circle cx="175" cy="102" r="2.0" fill="rgba(255,255,255,0.32)"/> <!-- Megrez  δ  最暗 -->
  <circle cx="282" cy="172" r="3.5" fill="rgba(255,255,255,0.54)"/> <!-- Alioth  ε  中上 -->
  <circle cx="398" cy="272" r="3.5" fill="rgba(255,255,255,0.58)"/> <!-- Mizar   ζ  右中 -->
  <circle cx="450" cy="400" r="3.0" fill="rgba(255,255,255,0.46)"/> <!-- Alkaid  η  右下 -->

  <!-- Scatter stars filling remaining corners -->
  <circle cx="390" cy="62"  r="2.0" fill="rgba(255,255,255,0.28)"/>
  <circle cx="458" cy="130" r="1.5" fill="rgba(255,255,255,0.20)"/>
  <circle cx="462" cy="210" r="1.5" fill="rgba(255,255,255,0.18)"/>
  <circle cx="52"  cy="320" r="1.5" fill="rgba(255,255,255,0.20)"/>
  <circle cx="90"  cy="440" r="2.0" fill="rgba(255,255,255,0.22)"/>
  <circle cx="230" cy="454" r="1.5" fill="rgba(255,255,255,0.18)"/>
  <circle cx="360" cy="448" r="2.0" fill="rgba(255,255,255,0.20)"/>
  <circle cx="460" cy="458" r="1.5" fill="rgba(255,255,255,0.16)"/>

  <!-- Rocket group, slightly tilted to the right -->
  <g transform="translate(256,248) rotate(18)">

    <!-- Nose cone -->
    <polygon points="0,-152 -48,-76 48,-76" fill="white"/>

    <!-- Body -->
    <rect x="-48" y="-76" width="96" height="162" rx="20" fill="white"/>

    <!-- Window outer ring -->
    <circle cx="0" cy="-6" r="28" fill="#bae6fd"/>
    <!-- Window inner -->
    <circle cx="0" cy="-6" r="20" fill="#0284c7"/>
    <!-- Window shine -->
    <circle cx="-9" cy="-14" r="6" fill="rgba(255,255,255,0.6)"/>

    <!-- Left fin -->
    <polygon points="-48,52 -90,114 -48,90" fill="#e2d9f3"/>
    <!-- Right fin -->
    <polygon points="48,52 90,114 48,90" fill="#e2d9f3"/>

    <!-- Exhaust nozzle -->
    <rect x="-22" y="84" width="44" height="18" rx="6" fill="#c4b5fd"/>

    <!-- Flame outer -->
    <ellipse cx="-8" cy="128" rx="14" ry="36" fill="url(#flame1)" transform="rotate(-8 0 102)"/>
    <ellipse cx="8"  cy="128" rx="14" ry="36" fill="url(#flame2)" transform="rotate(8 0 102)"/>
    <!-- Flame center -->
    <ellipse cx="0" cy="120" rx="10" ry="26" fill="#fef3c7"/>

  </g>
</svg>
