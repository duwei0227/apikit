<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    performance.mark('document-start');
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('p-dark');
      }
    } catch {}
  </script>
  <style>
    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #ffffff;
    }

    .p-dark body {
      background: #09090b;
    }

    .startup-shell {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #27272a;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .p-dark .startup-shell {
      background: #09090b;
      color: #f4f4f5;
    }

    .startup-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .startup-logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .startup-spinner {
      width: 22px;
      height: 22px;
      border: 2px solid #d4d4d8;
      border-top-color: #3f3f46;
      border-radius: 999px;
      animation: startup-spin 0.8s linear infinite;
    }

    .p-dark .startup-spinner {
      border-color: #3f3f46;
      border-top-color: #d4d4d8;
    }

    .startup-status {
      margin: 0;
      color: #71717a;
      font-size: 12px;
    }

    .p-dark .startup-status {
      color: #a1a1aa;
    }

    @keyframes startup-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-spinner {
        animation: none;
      }
    }
  </style>
  <title>ApiKit</title>
</head>

<body>
  <div id="app">
    <div class="startup-shell" role="status" aria-live="polite">
      <div class="startup-brand">
        <div class="startup-logo">ApiKit</div>
        <div class="startup-spinner" aria-hidden="true"></div>
        <p class="startup-status">Starting…</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
